<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>دیتەڵی تۆپی پێ</title>
    <style>
        /* ڕێکخستنی گشتی */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0a0a2e, #1a1a4e, #0a0a2e);
            min-height: 100vh;
            color: #fff;
            padding: 15px;
            direction: rtl;
        }

        /* سەرپەڕ */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            flex-wrap: wrap;
            gap: 12px;
        }

        .header h1 {
            font-size: clamp(18px, 4vw, 32px);
            background: linear-gradient(90deg, #ff6b6b, #ffd93d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .admin-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            padding: 10px 22px;
            border-radius: 50px;
            font-size: clamp(12px, 1.5vw, 16px);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            white-space: nowrap;
            min-width: fit-content;
        }

        .admin-btn:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
        }

        .admin-btn.logout {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
        }

        /* گرووپەکان */
        .groups-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            max-width: 1500px;
            margin: 0 auto;
        }

        .group-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .group-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .group-title {
            text-align: center;
            font-size: clamp(20px, 3vw, 32px);
            font-weight: 800;
            padding: 12px 0;
            margin-bottom: 18px;
            border-bottom: 3px solid rgba(255, 255, 255, 0.1);
            letter-spacing: 2px;
            background: linear-gradient(90deg, #ffd93d, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* خشتە */
        .table-wrapper {
            overflow-x: auto;
            border-radius: 15px;
            background: rgba(0, 0, 0, 0.3);
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 550px;
        }

        th {
            background: rgba(102, 126, 234, 0.3);
            padding: 12px 8px;
            font-size: clamp(11px, 1.2vw, 14px);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #ffd93d;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        td {
            padding: 10px 6px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            vertical-align: middle;
            font-size: clamp(12px, 1.2vw, 15px);
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.05);
        }

        .team-info {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            min-width: 120px;
        }

        .team-img {
            width: clamp(30px, 3.5vw, 45px);
            height: clamp(30px, 3.5vw, 45px);
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .team-img:hover {
            transform: scale(1.15);
            border-color: #ffd93d;
        }

        .team-name {
            font-weight: 600;
            font-size: clamp(12px, 1.2vw, 15px);
        }

        .rank-badge {
            display: inline-block;
            background: linear-gradient(135deg, #ffd93d, #f6b93b);
            color: #1a1a4e;
            font-weight: 800;
            width: clamp(26px, 2.8vw, 34px);
            height: clamp(26px, 2.8vw, 34px);
            line-height: clamp(26px, 2.8vw, 34px);
            border-radius: 50%;
            text-align: center;
            font-size: clamp(12px, 1.2vw, 15px);
        }

        .rank-1 { background: linear-gradient(135deg, #ffd700, #f7c948); color: #1a1a4e; }
        .rank-2 { background: linear-gradient(135deg, #c0c0c0, #a8a8a8); color: #1a1a4e; }
        .rank-3 { background: linear-gradient(135deg, #cd7f32, #b87333); color: #1a1a4e; }

        .points {
            font-weight: 800;
            font-size: clamp(16px, 1.6vw, 20px);
            color: #ffd93d;
        }

        .goals {
            font-weight: 600;
        }

        /* مۆدالی لۆگین */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a4e, #2d2d7a);
            padding: clamp(25px, 4vw, 40px);
            border-radius: 30px;
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
            animation: modalIn 0.4s ease;
            max-height: 90vh;
            overflow-y: auto;
        }

        @keyframes modalIn {
            from {
                transform: scale(0.8) translateY(30px);
                opacity: 0;
            }
            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        .modal-content h2 {
            text-align: center;
            font-size: clamp(22px, 3vw, 30px);
            margin-bottom: 25px;
            color: #ffd93d;
        }

        .modal-content label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #ddd;
            font-size: clamp(14px, 1.2vw, 16px);
        }

        .modal-content input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: clamp(14px, 1.2vw, 16px);
            transition: all 0.3s ease;
            margin-bottom: 18px;
            outline: none;
        }

        .modal-content input:focus {
            border-color: #667eea;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
        }

        .modal-content .login-submit {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: clamp(16px, 1.5vw, 18px);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-content .login-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
        }

        .modal-content .close-modal {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #aaa;
            cursor: pointer;
            transition: 0.3s;
            font-size: clamp(14px, 1.2vw, 16px);
        }

        .modal-content .close-modal:hover {
            color: #fff;
        }

        /* مۆدالی دەستکاری */
        .edit-modal .modal-content {
            max-width: 700px;
            max-height: 85vh;
            overflow-y: auto;
        }

        .edit-modal .modal-content h2 {
            font-size: clamp(20px, 2.5vw, 26px);
        }

        .edit-form-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
        }

        .edit-form-group label {
            font-size: clamp(11px, 1vw, 13px);
            color: #aaa;
        }

        .edit-form-group input {
            width: 100%;
            padding: 8px 12px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: clamp(12px, 1.1vw, 14px);
            outline: none;
            transition: 0.3s;
        }

        .edit-form-group input:focus {
            border-color: #667eea;
        }

        .edit-form-group .full-width {
            grid-column: 1 / -1;
        }

        .save-edit-btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #00b894, #00a86b);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: clamp(16px, 1.5vw, 18px);
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .save-edit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 184, 148, 0.4);
        }

        .edit-group-select {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.1);
            font-size: clamp(14px, 1.2vw, 16px);
            outline: none;
            margin-bottom: 18px;
        }

        .edit-group-select option {
            background: #1a1a4e;
        }

        /* هۆشدار */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 14px 25px;
            border-radius: 15px;
            font-weight: 600;
            z-index: 2000;
            animation: slideUp 0.5s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            font-size: clamp(13px, 1.1vw, 16px);
            max-width: 90%;
        }

        .toast.success {
            background: linear-gradient(135deg, #00b894, #00a86b);
            color: #fff;
        }

        .toast.error {
            background: linear-gradient(135deg, #e17055, #d63031);
            color: #fff;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* سکرۆڵ */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 10px;
        }

        /* Loading indicator */
        .loading {
            text-align: center;
            padding: 30px;
            color: #aaa;
            font-size: 18px;
        }

        /* ============================================================ */
        /* وەڵامدانەوە بۆ هەموو شاشەکان */
        /* ============================================================ */

        @media (max-width: 1200px) {
            .groups-container {
                gap: 20px;
                padding: 0 5px;
            }
            .group-card {
                padding: 16px;
            }
            table {
                min-width: 480px;
            }
            .team-info {
                min-width: 100px;
                gap: 8px;
            }
        }

        @media (max-width: 992px) {
            body {
                padding: 12px;
            }
            .header {
                padding: 12px 18px;
                gap: 10px;
            }
            .groups-container {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            .group-card {
                padding: 15px;
            }
            table {
                min-width: 420px;
            }
            th {
                padding: 10px 6px;
                font-size: 12px;
            }
            td {
                padding: 8px 5px;
                font-size: 13px;
            }
            .team-info {
                min-width: 90px;
                gap: 6px;
            }
            .team-name {
                font-size: 13px;
            }
            .points {
                font-size: 17px;
            }
            .rank-badge {
                width: 28px;
                height: 28px;
                line-height: 28px;
                font-size: 13px;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            .header {
                padding: 10px 15px;
                border-radius: 15px;
            }
            .header h1 {
                font-size: 20px;
            }
            .admin-btn {
                padding: 8px 16px;
                font-size: 13px;
            }
            .group-card {
                padding: 12px;
                border-radius: 15px;
            }
            .group-title {
                font-size: 22px;
                padding: 10px 0;
                margin-bottom: 12px;
            }
            table {
                min-width: 360px;
            }
            th {
                padding: 8px 4px;
                font-size: 11px;
            }
            td {
                padding: 6px 4px;
                font-size: 12px;
            }
            .team-info {
                min-width: 80px;
                gap: 5px;
            }
            .team-img {
                width: 28px;
                height: 28px;
            }
            .team-name {
                font-size: 12px;
            }
            .points {
                font-size: 15px;
            }
            .rank-badge {
                width: 24px;
                height: 24px;
                line-height: 24px;
                font-size: 11px;
            }
            .modal-content {
                padding: 20px;
                max-width: 95%;
            }
            .edit-form-group {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
                padding: 12px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 8px;
            }
            .header {
                padding: 8px 12px;
                border-radius: 12px;
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .header h1 {
                font-size: 18px;
                text-align: center;
            }
            .admin-btn {
                padding: 10px 14px;
                font-size: 14px;
                width: 100%;
                text-align: center;
            }
            .groups-container {
                gap: 15px;
            }
            .group-card {
                padding: 10px;
                border-radius: 12px;
            }
            .group-title {
                font-size: 20px;
                padding: 8px 0;
                margin-bottom: 10px;
            }
            .table-wrapper {
                border-radius: 10px;
            }
            table {
                min-width: 300px;
            }
            th {
                padding: 6px 3px;
                font-size: 10px;
                letter-spacing: 0px;
            }
            td {
                padding: 5px 3px;
                font-size: 11px;
            }
            .team-info {
                min-width: 65px;
                gap: 4px;
                flex-direction: column;
            }
            .team-img {
                width: 24px;
                height: 24px;
                border-width: 1.5px;
            }
            .team-name {
                font-size: 10px;
                white-space: nowrap;
            }
            .points {
                font-size: 14px;
            }
            .goals {
                font-size: 11px;
            }
            .rank-badge {
                width: 20px;
                height: 20px;
                line-height: 20px;
                font-size: 10px;
            }
            .modal-content {
                padding: 15px;
                border-radius: 20px;
            }
            .modal-content h2 {
                font-size: 20px;
                margin-bottom: 18px;
            }
            .modal-content input {
                padding: 10px 14px;
                font-size: 14px;
                margin-bottom: 14px;
            }
            .edit-form-group {
                grid-template-columns: 1fr;
                gap: 8px;
                padding: 10px;
            }
            .edit-form-group .full-width {
                grid-column: 1;
            }
            .edit-group-select {
                padding: 10px;
                font-size: 14px;
            }
            .save-edit-btn {
                padding: 11px;
                font-size: 16px;
            }
            .toast {
                padding: 12px 18px;
                font-size: 13px;
                bottom: 15px;
                right: 15px;
                max-width: 85%;
            }
        }

        @media (max-width: 360px) {
            body {
                padding: 5px;
            }
            .header h1 {
                font-size: 16px;
            }
            table {
                min-width: 250px;
            }
            th {
                font-size: 9px;
                padding: 4px 2px;
            }
            td {
                font-size: 10px;
                padding: 4px 2px;
            }
            .team-info {
                min-width: 55px;
                gap: 3px;
            }
            .team-img {
                width: 20px;
                height: 20px;
            }
            .team-name {
                font-size: 9px;
            }
            .points {
                font-size: 12px;
            }
            .rank-badge {
                width: 18px;
                height: 18px;
                line-height: 18px;
                font-size: 9px;
            }
            .group-title {
                font-size: 17px;
            }
            .admin-btn {
                font-size: 12px;
                padding: 8px 10px;
            }
            .modal-content {
                padding: 12px;
            }
            .modal-content h2 {
                font-size: 18px;
            }
        }

        @media (min-width: 1600px) {
            .groups-container {
                max-width: 1800px;
                gap: 35px;
            }
            .group-card {
                padding: 30px;
            }
            table {
                min-width: 700px;
            }
            th {
                padding: 16px 14px;
                font-size: 16px;
            }
            td {
                padding: 14px 12px;
                font-size: 17px;
            }
            .team-info {
                min-width: 180px;
                gap: 15px;
            }
            .team-img {
                width: 50px;
                height: 50px;
            }
            .team-name {
                font-size: 18px;
            }
            .points {
                font-size: 22px;
            }
            .rank-badge {
                width: 38px;
                height: 38px;
                line-height: 38px;
                font-size: 17px;
            }
        }
    </style>
</head>
<body>

    <!-- سەرپەڕ -->
    <header class="header">
        <h1>⚽ دیتەڵی تۆپی پێ</h1>
        <button class="admin-btn" id="adminLoginBtn">🔐 پەنەلی ئەدمین</button>
    </header>

    <!-- گرووپەکان -->
    <div class="groups-container" id="groupsContainer">
        <div class="loading" id="loadingIndicator">⏳ بارکردنی داتاکان...</div>
        
        <!-- گرووپ A -->
        <div class="group-card" id="groupA" style="display:none;">
            <div class="group-title">گرووپ A</div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>هەڵبژاردە</th>
                            <th>خاڵ</th>
                            <th>گۆڵ</th>
                            <th>گۆڵ لێکران</th>
                            <th>جیاوازی</th>
                        </tr>
                    </thead>
                    <tbody id="groupATbody"></tbody>
                </table>
            </div>
        </div>

        <!-- گرووپ B -->
        <div class="group-card" id="groupB" style="display:none;">
            <div class="group-title">گرووپ B</div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>هەڵبژاردە</th>
                            <th>خاڵ</th>
                            <th>گۆڵ</th>
                            <th>گۆڵ لێکران</th>
                            <th>جیاوازی</th>
                        </tr>
                    </thead>
                    <tbody id="groupBTbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- مۆدالی لۆگین -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <h2>🔑 چوونە ژوورەوە</h2>
            <label>ناوی بەکارهێنەر</label>
            <input type="text" id="usernameInput" placeholder="ناوی بەکارهێنەر">
            <label>تێپەڕەوشە</label>
            <input type="password" id="passwordInput" placeholder="تێپەڕەوشە">
            <button class="login-submit" id="loginSubmit">چوونە ژوورەوە</button>
            <span class="close-modal" id="closeLoginModal">داخستن</span>
        </div>
    </div>

    <!-- مۆدالی دەستکاری -->
    <div class="modal edit-modal" id="editModal">
        <div class="modal-content">
            <h2>✏️ دەستکاری دیتەڵ</h2>
            <select class="edit-group-select" id="editGroupSelect">
                <option value="A">گرووپ A</option>
                <option value="B">گرووپ B</option>
            </select>
            <div id="editFormContainer"></div>
            <button class="save-edit-btn" id="saveEditBtn">💾 پاشەکەوتکردن</button>
            <span class="close-modal" id="closeEditModal">داخستن</span>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js",
                "firebase/database": "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js"
            }
        }
    </script>

    <script type="module">
        // Firebase imports
        import { initializeApp } from "firebase/app";
        import { getDatabase, ref, onValue, set, get, child } from "firebase/database";

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyBx-Ff2YcFX4H2kpdJvlhWZcIyJ1JRfJmY",
            authDomain: "sun4-6f764.firebaseapp.com",
            projectId: "sun4-6f764",
            storageBucket: "sun4-6f764.firebasestorage.app",
            messagingSenderId: "1071133630664",
            appId: "1:1071133630664:web:752ba657845b2005f745fd",
            measurementId: "G-YELRYLN23N"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Default data
        const defaultData = {
            A: [
                { name: 'ئێران', img: 'https://flagcdn.com/ir.svg', points: 6, goals: 5, goalsAgainst: 2 },
                { name: 'عێراق', img: 'https://flagcdn.com/iq.svg', points: 4, goals: 4, goalsAgainst: 3 },
                { name: 'ئەڵمانیا', img: 'https://flagcdn.com/de.svg', points: 3, goals: 3, goalsAgainst: 3 },
                { name: 'ئیسپانیا', img: 'https://flagcdn.com/es.svg', points: 1, goals: 2, goalsAgainst: 6 }
            ],
            B: [
                { name: 'بەڕازیل', img: 'https://flagcdn.com/br.svg', points: 7, goals: 7, goalsAgainst: 1 },
                { name: 'ئەرجەنتین', img: 'https://flagcdn.com/ar.svg', points: 5, goals: 5, goalsAgainst: 3 },
                { name: 'پورتوگال', img: 'https://flagcdn.com/pt.svg', points: 3, goals: 3, goalsAgainst: 4 },
                { name: 'ئینگلتەرا', img: 'https://flagcdn.com/gb.svg', points: 1, goals: 2, goalsAgainst: 9 }
            ]
        };

        let data = { A: [], B: [] };
        let isAdmin = false;

        // DOM elements
        const loadingIndicator = document.getElementById('loadingIndicator');
        const groupA = document.getElementById('groupA');
        const groupB = document.getElementById('groupB');

        // فەنکشنی ڕیزبەندی
        function sortTeams(teams) {
            return [...teams].sort((a, b) => {
                if (b.points !== a.points) return b.points - a.points;
                const diffA = a.goals - a.goalsAgainst;
                const diffB = b.goals - b.goalsAgainst;
                if (diffB !== diffA) return diffB - diffA;
                return b.goals - a.goals;
            });
        }

        // ڕێکخستنی خشتە
        function renderGroup(groupKey) {
            const tbody = document.getElementById(`group${groupKey}Tbody`);
            if (!tbody) return;
            
            const teams = data[groupKey] || [];
            if (teams.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:20px;color:#888;">هیچ داتایەک نییە</td></tr>`;
                return;
            }
            
            const sorted = sortTeams(teams);
            tbody.innerHTML = '';
            sorted.forEach((team, index) => {
                const rank = index + 1;
                let rankClass = 'rank-badge';
                if (rank === 1) rankClass += ' rank-1';
                else if (rank === 2) rankClass += ' rank-2';
                else if (rank === 3) rankClass += ' rank-3';
                const diff = team.goals - team.goalsAgainst;
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><span class="${rankClass}">${rank}</span></td>
                    <td>
                        <div class="team-info">
                            <img src="${team.img || 'https://via.placeholder.com/40/1a1a4e/fff?text=?'}" alt="${team.name}" class="team-img" loading="lazy" onerror="this.src='https://via.placeholder.com/40/1a1a4e/fff?text=?'">
                            <span class="team-name">${team.name}</span>
                        </div>
                    </td>
                    <td class="points">${team.points}</td>
                    <td class="goals">${team.goals}</td>
                    <td class="goals">${team.goalsAgainst}</td>
                    <td class="goals" style="color:${diff >= 0 ? '#00b894' : '#e17055'}">${diff > 0 ? '+' : ''}${diff}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderAll() {
            renderGroup('A');
            renderGroup('B');
            
            // Show groups, hide loading
            loadingIndicator.style.display = 'none';
            groupA.style.display = 'block';
            groupB.style.display = 'block';
        }

        // Load data from Firebase with real-time updates
        function loadDataFromFirebase() {
            const dbRef = ref(db, 'footballData');
            
            onValue(dbRef, (snapshot) => {
                const firebaseData = snapshot.val();
                
                if (firebaseData && firebaseData.A && firebaseData.B) {
                    // Use data from Firebase
                    data.A = firebaseData.A;
                    data.B = firebaseData.B;
                    console.log('✅ داتا لە Firebaseەوە بارکرا');
                } else {
                    // No data in Firebase, save default data
                    console.log('📝 داتای بنەڕەت لە Firebase دەنرێت...');
                    set(dbRef, defaultData).then(() => {
                        data.A = [...defaultData.A];
                        data.B = [...defaultData.B];
                        console.log('✅ داتای بنەڕەت پاشەکەوت کرا');
                    }).catch((error) => {
                        console.error('❌ هەڵە لە پاشەکەوتکردنی داتای بنەڕەت:', error);
                        // Use default data locally if can't save
                        data.A = [...defaultData.A];
                        data.B = [...defaultData.B];
                    });
                }
                renderAll();
            }, (error) => {
                console.error('❌ هەڵە لە خوێندنەوەی داتا:', error);
                // Fallback to default data
                data.A = [...defaultData.A];
                data.B = [...defaultData.B];
                renderAll();
                showToast('⚠️ کێشە لە پەیوەندی بە Firebaseەوە، داتای ناوخۆیی بەکارهات', 'error');
            });
        }

        // Save data to Firebase
        function saveDataToFirebase() {
            const dbRef = ref(db, 'footballData');
            return set(dbRef, {
                A: data.A,
                B: data.B
            });
        }

        // مۆدالی لۆگین
        const loginModal = document.getElementById('loginModal');
        const adminBtn = document.getElementById('adminLoginBtn');
        const closeLogin = document.getElementById('closeLoginModal');
        const loginSubmit = document.getElementById('loginSubmit');

        adminBtn.addEventListener('click', () => {
            if (isAdmin) {
                logout();
            } else {
                loginModal.classList.add('active');
                document.getElementById('usernameInput').value = '';
                document.getElementById('passwordInput').value = '';
                document.getElementById('usernameInput').focus();
            }
        });

        closeLogin.addEventListener('click', () => loginModal.classList.remove('active'));
        loginModal.addEventListener('click', (e) => {
            if (e.target === loginModal) loginModal.classList.remove('active');
        });

        loginSubmit.addEventListener('click', () => {
            const user = document.getElementById('usernameInput').value.trim();
            const pass = document.getElementById('passwordInput').value.trim();
            if (user === 'z' && pass === '1') {
                isAdmin = true;
                loginModal.classList.remove('active');
                adminBtn.textContent = '🚪 دەرچون';
                adminBtn.classList.add('logout');
                showToast('✅ بە سەرکەوتوو چوویتە ژوورەوە!', 'success');
                openEditModal();
            } else {
                showToast('❌ ناوی بەکارهێنەر یان تێپەڕەوشە هەڵەیە!', 'error');
                document.getElementById('passwordInput').value = '';
                document.getElementById('passwordInput').focus();
            }
        });

        // Enter کلیک
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && loginModal.classList.contains('active')) {
                loginSubmit.click();
            }
        });

        // دەرچون
        function logout() {
            isAdmin = false;
            adminBtn.textContent = '🔐 پەنەلی ئەدمین';
            adminBtn.classList.remove('logout');
            document.getElementById('editModal').classList.remove('active');
            showToast('👋 دەرچوت!', 'success');
        }

        // تۆاست
        function showToast(message, type = 'success') {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3500);
        }

        // مۆدالی دەستکاری
        const editModal = document.getElementById('editModal');
        const closeEdit = document.getElementById('closeEditModal');
        const editGroupSelect = document.getElementById('editGroupSelect');
        const editFormContainer = document.getElementById('editFormContainer');
        const saveEditBtn = document.getElementById('saveEditBtn');

        function openEditModal() {
            editModal.classList.add('active');
            buildEditForm(editGroupSelect.value);
        }

        closeEdit.addEventListener('click', () => editModal.classList.remove('active'));
        editModal.addEventListener('click', (e) => {
            if (e.target === editModal) editModal.classList.remove('active');
        });

        editGroupSelect.addEventListener('change', () => {
            buildEditForm(editGroupSelect.value);
        });

        function buildEditForm(groupKey) {
            const teams = data[groupKey] || [];
            let html = '';
            teams.forEach((team, index) => {
                html += `
                    <div class="edit-form-group" data-index="${index}">
                        <div class="full-width">
                            <label>ناوی هەڵبژاردە</label>
                            <input type="text" class="edit-name" value="${team.name || ''}">
                        </div>
                        <div class="full-width">
                            <label>لینکی وێنە</label>
                            <input type="text" class="edit-img" value="${team.img || ''}">
                        </div>
                        <div>
                            <label>خاڵ</label>
                            <input type="number" class="edit-points" value="${team.points || 0}" min="0">
                        </div>
                        <div>
                            <label>گۆڵ</label>
                            <input type="number" class="edit-goals" value="${team.goals || 0}" min="0">
                        </div>
                        <div>
                            <label>گۆڵ لێکران</label>
                            <input type="number" class="edit-against" value="${team.goalsAgainst || 0}" min="0">
                        </div>
                    </div>
                `;
            });
            editFormContainer.innerHTML = html;
        }

        saveEditBtn.addEventListener('click', async () => {
            if (!isAdmin) {
                showToast('❌ تۆ ئەدمین نیت!', 'error');
                return;
            }
            
            const groupKey = editGroupSelect.value;
            const formGroups = editFormContainer.querySelectorAll('.edit-form-group');
            const newData = [];
            
            formGroups.forEach((group) => {
                const name = group.querySelector('.edit-name').value.trim();
                const img = group.querySelector('.edit-img').value.trim();
                const points = parseInt(group.querySelector('.edit-points').value) || 0;
                const goals = parseInt(group.querySelector('.edit-goals').value) || 0;
                const goalsAgainst = parseInt(group.querySelector('.edit-against').value) || 0;
                if (name) {
                    newData.push({ 
                        name, 
                        img: img || 'https://via.placeholder.com/40/1a1a4e/fff?text=?', 
                        points, 
                        goals,
                        goalsAgainst 
                    });
                }
            });
            
            if (newData.length !== 4) {
                showToast('❌ پێویستە 4 یانە هەبێت!', 'error');
                return;
            }
            
            // Update local data
            data[groupKey] = newData;
            
            // Save to Firebase
            try {
                await saveDataToFirebase();
                renderAll();
                showToast('✅ داتاکان بە سەرکەوتوو پاشەکەوت کران!', 'success');
                editModal.classList.remove('active');
            } catch (error) {
                console.error('❌ هەڵە لە پاشەکەوتکردن:', error);
                showToast('❌ کێشە لە پاشەکەوتکردندا!', 'error');
            }
        });

        // دەستپێکردن - Load data from Firebase
        console.log('🚀 دەستپێکردنی پەڕە...');
        loadDataFromFirebase();

        console.log('👋 بەخێربێیت! ناوی بەکارهێنەر: z، تێپەڕەوشە: 1');
    </script>
</body>
</html>
